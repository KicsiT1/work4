<section class="ProductContainer">
    <div class="Products">
        @for(Product of products; track Product)
        {
        <div class="Product">
            <div class="PImg">
                <img [src]="Product.Thumbnail" alt="">
            </div>
            <p class="PName">{{Product.Name}}</p>
            <div class="ProductPricesContainer">
                <p class="DPrice">$0.00</p>
                <p class="PPrice">${{Product.Price}}</p>
            </div>
            
            <div class="PColors">
                <div class="ColorContainer">
                    <div class="Color"></div>
                </div>

                 <div class="ColorContainer">
                    <div class="Color"></div>
                </div>
            </div>
        </div>
        }
    </div>
</section>
