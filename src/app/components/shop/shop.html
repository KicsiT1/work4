<section class="TextContent">
    <h1>Fashion</h1>
    <p>Store</p>
</section>

<div class="Grid">

    <div class="Filter">
        <app-product-filter 
        (filteredProductsChange)="onFilterApplied($event)"
        (ProducCollectionIndex)="ProducCollectionIndexApplied($event)">
        </app-product-filter>
    </div>

    <div class="ProductLayoutSwitcher">
        <app-product-layout-switcher  
        (FilterActive)="FilterActive($event)"
        [ProdCollectionIndex]="ProducCollectionIndex"></app-product-layout-switcher>
    </div>

    <div class="ProductContent">
        <app-product-content 
        [currentPage]="Pages"
        [products]="filteredData"
        (ProductsArrayLength)="onProductsLengthChanged($event)"></app-product-content>
    </div>

     <div class="Pagination">
        <app-pagination  (pageChanged)="onPageChanged($event)"  [productsLength]="ProductsLength"></app-pagination>
    </div>

</div>

<div class="PhoneFilter"  [class.active]="!PhoneFilterOpen">
    <app-product-filter 
    (filteredProductsChange)="onFilterApplied($event)"
     (closeFilter)="onCloseFilter($event)"
    (ProducCollectionIndex)="ProducCollectionIndexApplied($event)">
    </app-product-filter>
</div>
