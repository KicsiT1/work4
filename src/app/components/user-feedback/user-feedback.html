<section class="UserFeedback">
    <!--The text in the middle.-->
    <div class="TextContent">
        <h2>This Is What Our Customers Say</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Scelerisque duis</p>
    </div>

    <div class="UserFeedbackViewport">
        <div class="UserFeedbackContainer" [style.transform]="'translateX(' + (-activeIndex * 100) + '%)'">
            <!--The card itself.-->
            <div class="UFBItem" *ngFor="let user of users$ | async ; let i = index" [class.active]=" activeIndex === i">
                <div class="UFBCard UFBCard1">
                    <!--The image in the card.-->
                    <div class="UFBCardImg">
                        <img src="{{user.AvatarImg}}" alt="">
                    </div>
                    <!--Text content of the card.-->
                    <div class="UFBCardTextContent">
                        <p class="UFBCardUserComment">
                           “{{user.OpinionAboutStore}}”
                        </p>
                        <fa-icon *ngFor="let i of [].constructor(user.GeneralRating)" [icon]=faStar></fa-icon>
                        <div class="BlackLine"></div>
                        <h3 class="UserName">{{user.FirstName}}</h3>
                        <p class="UserProfession">{{user.Profession}}</p>
                    </div>

                </div>
            </div>

        </div>
    </div>
    <!--The two buttons-->
    <div class="Buttons">
        <fa-icon [icon]=faAngleLeft (click)="prev()"></fa-icon>
        <fa-icon [icon]=faAngleRight (click)="next()"></fa-icon>
    </div>

</section>
